<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Uma pergunta importante 🦆</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#f8eaff,#eee0ff,#fff7fc);
overflow:hidden
}

.card{
width:min(520px,100%);
background:rgba(255,255,255,.95);
border-radius:28px;
padding:28px 22px;
text-align:center;
box-shadow:0 18px 50px rgba(91,45,120,.18)
}

h1{
color:#68258a;
font-size:clamp(27px,7vw,38px);
margin:0 0 10px
}

.subtitle{
color:#6f6175;
font-size:17px;
line-height:1.5;
margin-bottom:18px
}

.photo{
width:min(300px,80vw);
height:min(300px,80vw);
object-fit:contain;
border-radius:22px;
display:block;
margin:10px auto 20px
}

.buttons{
display:flex;
justify-content:center;
gap:14px;
flex-wrap:wrap
}

button{
border:0;
border-radius:16px;
padding:14px 28px;
min-width:120px;
min-height:50px;
font-size:17px;
font-weight:bold;
cursor:pointer;
transition:.2s
}

#yes{
background:#8e44ad;
color:white;
box-shadow:0 8px 20px #8e44ad44
}

#no{
background:#eee7f2;
color:#684d70
}

button:active{
transform:scale(.94)
}

.message{
margin-top:18px;
color:#7b328f;
font-weight:bold;
min-height:25px
}

.hidden{
display:none
}

.final{
animation:entrada .7s ease
}

@keyframes entrada{
from{
opacity:0;
transform:translateY(20px) scale(.95)
}
to{
opacity:1;
transform:translateY(0) scale(1)
}
}

.heart{
position:fixed;
font-size:24px;
pointer-events:none;
animation:subir 2.5s linear forwards
}

@keyframes subir{
from{
transform:translateY(0);
opacity:1
}
to{
transform:translateY(-100vh) scale(1.5);
opacity:0
}
}
</style>
</head>

<body>

<main class="card">

<section id="question">

<h1>Tenho uma pergunta pra você... 🦆</h1>

<p class="subtitle" id="text">
Você aceita viajar comigo? 🥺✈️
</p>

<img id="duck" class="photo">

<div class="buttons">

<button id="yes">
SIM 💜
</button>

<button id="no">
NÃO 😭
</button>

</div>

<div id="message" class="message"></div>

</section>


<section id="final" class="hidden final">

<h1>EU SABIAAAAA 😭💜</h1>

<p class="subtitle">
Então está decidido:<br>
vamos viajar juntos! ✈️🌎<br><br>
Agora só falta escolher o destino. 🦆💜
</p>

<img id="simImage" class="photo">

<p class="message">
PREPARE AS MALASSSS 😎✈️💜
</p>

</section>

</main>


<script>

/*
==================================================
AS IMAGENS ESTÃO DENTRO DO PRÓPRIO HTML
==================================================
*/

const imagens = {

nao1: "data:image/jpeg;base64,COLE_AQUI_A_IMAGEM_NAO1",

nao2: "data:image/jpeg;base64,COLE_AQUI_A_IMAGEM_NAO2",

nao3: "data:image/jpeg;base64,COLE_AQUI_A_IMAGEM_NAO3",

sim: "data:image/jpeg;base64,COLE_AQUI_A_IMAGEM_SIM"

};


/*
==================================================
ELEMENTOS
==================================================
*/

const duck = document.getElementById("duck");
const simImage = document.getElementById("simImage");

const text = document.getElementById("text");
const message = document.getElementById("message");

const yes = document.getElementById("yes");
const no = document.getElementById("no");

const question = document.getElementById("question");
const final = document.getElementById("final");


/*
==================================================
IMAGEM INICIAL
==================================================
*/

duck.src = imagens.nao1;


/*
==================================================
CONTROLE DO NÃO
==================================================
*/

let tentativa = 0;

const mensagens = [

"Você tem certeza que quer dizer não? 🥺",

"Pensa direitinho... uma viagem comigo não parece tão ruim assim 😭",

"NÃO ACEITO ESSA RESPOSTA KKKKKKK 😭🦆",

"VOCÊ AINDA TÁ DIZENDO NÃO??? 😭",

"CHEGA DE NÃO, ESCOLHE SIM LOGO 😭💜"

];


no.addEventListener("click", () => {

tentativa++;


/*
Troca as imagens
*/

if(tentativa === 1){

duck.src = imagens.nao2;

}

else if(tentativa === 2){

duck.src = imagens.nao3;

}


/*
Troca os textos
*/

text.textContent =
mensagens[Math.min(tentativa - 1,mensagens.length - 1)];


message.textContent =
"Essa resposta pode ser reconsiderada... 👀";


/*
Faz o SIM crescer
*/

const tamanho =
Math.min(1 + tentativa * .12,1.7);

yes.style.transform =
`scale(${tamanho})`;


/*
Depois de algumas tentativas
o NÃO começa a fugir
*/

if(tentativa >= 4){

no.style.position = "relative";

no.style.left =
(Math.random()*140-70)+"px";

no.style.top =
(Math.random()*70-35)+"px";

}

});


/*
==================================================
BOTÃO SIM
==================================================
*/

yes.addEventListener("click", () => {

question.classList.add("hidden");

final.classList.remove("hidden");

simImage.src = imagens.sim;


/*
Corações e patinhos
*/

for(let i=0;i<25;i++){

setTimeout(() => {

const elemento =
document.createElement("div");

elemento.className = "heart";

elemento.textContent =
Math.random()>.5 ? "💜" : "🦆";

elemento.style.left =
Math.random()*100+"vw";

elemento.style.bottom =
"-30px";

document.body.appendChild(elemento);

setTimeout(() => {

elemento.remove();

},2500);

},i*80);

}

});

</script>

</body>
</html>
